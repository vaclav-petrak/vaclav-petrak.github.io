  <title>Clareon Toric – ÚVN</title>
  <style>
  /* ÚVN identity (základní logomanuál ÚVN): Pantone 275 (navy violet) + Pantone 306 C (cyan) */
  :root {
    --bg: #f4f5f9;
    --card: #ffffff;
    --text: #1b1d2a;
    --muted: #5a5d72;
    --faint: #8c8fa3;
    --border: #e0e2ec;
    --primary: #261955;
    --primary-dark: #180f3a;
    --primary-soft: #ebe8f4;
    --accent: #009fe3;
    --accent-soft: #e0f3fc;
    --focus: rgba(0, 159, 227, .45);
    --shadow: 0 1px 2px rgba(25, 18, 60, .06), 0 4px 14px rgba(25, 18, 60, .06);
    --radius: 12px;
    --ok: #237a4b;    --ok-bg: #e3f5ea;
    --due: #1f5fae;   --due-bg: #e3edfb;
    --late: #b42d2d;  --late-bg: #fbe6e6;
    --soon: #93630a;  --soon-bg: #fdf1d7;
    --grey: #56596a;  --grey-bg: #eceef3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 Arial, "Helvetica Neue", Helvetica, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  svg { display: block; }
  [data-icon] { display: inline-flex; }

  /* ---------- header ---------- */
  .topbar { background: var(--primary); color: #fff; border-bottom: 4px solid var(--accent);
    box-shadow: 0 2px 10px rgba(25, 18, 60, .25); }
  .topbar-inner { max-width: 880px; margin: 0 auto; padding: 10px 16px; display: flex;
    justify-content: space-between; align-items: center; gap: 12px; }
  .brand { display: inline-flex; align-items: center; gap: 12px; background: none; border: 0; color: #fff;
    padding: 2px 0; cursor: pointer; min-height: 40px; text-align: left; min-width: 0; }
  .brand:hover:not(:disabled) { border-color: transparent; }
  .brand-mark { width: 40px; height: 40px; flex: none; }
  .brand-mark svg { width: 100%; height: 100%; }
  .brand-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  #brand-title { font-weight: 700; font-size: 17px; }
  .brand-sub { font-size: 12px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-links { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .top-link { display: inline-flex; align-items: center; gap: 6px; color: #fff; text-decoration: none; font-size: 14px;
    font-weight: 600; padding: 6px 12px; border-radius: 999px; background: rgba(255, 255, 255, .18); white-space: nowrap; }
  .top-link:hover { background: rgba(255, 255, 255, .28); }
  button.top-link { min-height: 0; border: 0; cursor: pointer; }
  button.top-link:hover:not(:disabled) { background: rgba(255, 255, 255, .28); }
  .top-link:focus-visible, .brand:focus-visible { outline: 3px solid rgba(255, 255, 255, .6); outline-offset: 2px; }
  .dash-link { display: inline-flex; align-items: center; gap: 6px; color: var(--primary); font-weight: 600;
    text-decoration: none; margin: 0 0 16px; }
  .dash-link:hover { text-decoration: underline; }
  .user { font-size: 13px; opacity: .9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background: rgba(255, 255, 255, .14); padding: 4px 10px; border-radius: 999px; min-width: 0; }

  .container { max-width: 880px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 26px; line-height: 1.25; margin: 6px 0 18px; letter-spacing: -.01em; }
  h2 { font-size: 18px; margin: 0; }
  .muted { color: var(--muted); }

  .loading { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 8px 0 16px; }
  .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--primary-soft);
    border-top-color: var(--primary); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- buttons ---------- */
  button { min-height: 44px; padding: 8px 18px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); cursor: pointer; transition: background .15s, border-color .15s, box-shadow .15s; }
  button:hover:not(:disabled) { border-color: #c5c8d8; }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  button:disabled { opacity: .55; cursor: default; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--primary-dark); }
  button.small { min-height: 36px; padding: 4px 12px; font-size: 14px; }
  button.back { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none;
    padding: 4px 0; color: var(--primary); font-weight: 600; min-height: 36px; }

  /* ---------- banner ---------- */
  .banner { padding: 12px 16px; border-radius: 12px; margin-bottom: 18px; white-space: pre-line;
    border: 1px solid transparent; font-weight: 500; }
  .banner.success { background: var(--ok-bg); color: var(--ok); border-color: #bfe5cd; }
  .banner.error { background: var(--late-bg); color: var(--late); border-color: #f1c4c4; }
  .banner.info { background: var(--due-bg); color: var(--due); border-color: #c4d8f3; }

  /* ---------- home ---------- */
  .hero-date { margin: 0; color: var(--muted); font-size: 15px; }
  .hero-date::first-letter { text-transform: uppercase; }

  .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .action { display: flex; align-items: center; gap: 14px; text-align: left; padding: 16px 18px; min-height: 84px;
    border: 0; border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); }
  .action:hover:not(:disabled) { box-shadow: 0 2px 4px rgba(25, 18, 60, .08), 0 10px 24px rgba(25, 18, 60, .1); }
  .action-icon { width: 48px; height: 48px; border-radius: 12px; background: var(--primary-soft); color: var(--primary);
    align-items: center; justify-content: center; flex: none; }
  .action-text strong { display: block; font-size: 17px; }
  .action-text span { display: block; color: var(--muted); font-size: 14px; }

  /* ---------- cards & lists ---------- */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; margin: 0 0 16px; }
  .card-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters button { min-height: 34px; padding: 3px 12px; border-radius: 999px; font-size: 14px; }
  .filters button[aria-selected="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
  .filters .count { opacity: .75; margin-left: 4px; }

  .due-list, .pt-results, .timeline { list-style: none; margin: 0; padding: 0; }
  .due-item { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; border: 0; border-radius: 10px;
    background: none; padding: 10px 8px; min-height: 60px; }
  .due-item:hover { background: var(--bg); }
  .due-list li + li { border-top: 1px solid var(--border); }
  .due-main { flex: 1; min-width: 0; }
  .due-main .who { font-weight: 600; }
  .due-main .who span { font-weight: 400; color: var(--muted); }
  .due-main .what { font-size: 14px; color: var(--muted); }
  .chev { color: var(--faint); flex: none; }
  .empty { color: var(--muted); padding: 14px 4px; }

  .chip { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 2px 10px; border-radius: 999px;
    white-space: nowrap; flex: none; }
  .chip.done { background: var(--ok-bg); color: var(--ok); }
  .chip.due { background: var(--due-bg); color: var(--due); }
  .chip.overdue { background: var(--late-bg); color: var(--late); }
  .chip.soon, .chip.outside { background: var(--soon-bg); color: var(--soon); }
  .chip.not_yet_due, .chip.unknown, .chip.waiting, .chip.not_applicable, .chip.ended { background: var(--grey-bg); color: var(--grey); }
  .chip.missed { background: var(--late-bg); color: var(--late); opacity: .8; }

  /* ---------- check-up: search & participant ---------- */
  .search { position: relative; margin-bottom: 10px; }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--faint); }
  .search input[type=search] { padding-left: 46px; -webkit-appearance: none; appearance: none; }
  .pt-results { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .pt-results li + li { border-top: 1px solid var(--border); }
  .pt-item { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; border: 0; border-radius: 0;
    background: none; padding: 12px 16px; min-height: 56px; }
  .pt-item:hover { background: var(--bg); }
  .pt-id { font-weight: 700; color: var(--primary); min-width: 52px; }
  .pt-label { flex: 1; color: var(--muted); }

  .avatar { width: 52px; height: 52px; border-radius: 14px; background: var(--primary-soft); color: var(--primary);
    display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none; }
  .person { display: flex; align-items: center; gap: 14px; }
  .person-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

  .timeline li { position: relative; display: flex; gap: 14px; padding: 12px 0 12px 0; }
  .timeline li + li { border-top: 1px solid var(--border); }
  .dot { width: 14px; height: 14px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--grey-bg);
    border: 3px solid var(--faint); }
  .dot.done { border-color: var(--ok); background: var(--ok); }
  .dot.due { border-color: var(--due); background: #fff; }
  .dot.soon { border-color: var(--soon); background: #fff; }
  .dot.overdue { border-color: var(--late); background: #fff; }
  .dot.missed { border-color: var(--late); background: var(--late-bg); }
  .dot.ended, .dot.waiting, .dot.not_yet_due { border-color: var(--faint); background: #fff; }
  .tp-body { flex: 1; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tp-info { flex: 1 1 240px; }
  .tp-info .detail { font-size: 14px; color: var(--muted); }
  .tp-info strong { margin-right: 6px; }
  .tp-badge { display: inline-block; color: #fff; min-width: 38px; text-align: center; font-size: 13px; font-weight: 700;
    padding: 3px 8px; border-radius: 8px; flex: none; vertical-align: 1px; }
  .due-group { padding: 14px 8px 4px; color: var(--text); font-weight: 700; font-size: 12.5px; letter-spacing: .05em; text-transform: uppercase; }
  .due-group:first-child { padding-top: 4px; }
  .due-group .count { opacity: .7; }
  .due-list li.due-group + li { border-top: 0; }

  /* ---------- participant data (read only) ---------- */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .card-empty { box-shadow: none; border: 1px dashed var(--border); background: transparent; }
  .card .detail { font-size: 14px; color: var(--muted); }
  .card .detail.meta { color: var(--faint); font-size: 13px; }
  .answers { margin-top: 6px; }
  .answers-section { padding: 14px 0 2px; font-weight: 700; font-size: 12px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--primary); }
  .answer { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 16px; padding: 8px 0;
    border-top: 1px solid var(--border); }
  .answer .q { color: var(--muted); }
  .answer .a { font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; }
  .answer .a.empty-value { color: var(--faint); font-weight: 400; }
  @media (max-width: 520px) { .answer { grid-template-columns: 1fr; gap: 0; } }

  /* ---------- form ---------- */
  .form-subtitle { color: var(--muted); margin: -8px 0 18px; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 15px; }
  .form-subtitle span { display: inline-flex; align-items: center; gap: 6px; }
  fieldset.section { border: 0; border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow);
    padding: 8px 18px 12px; margin: 0 0 16px; min-width: 0; }
  fieldset.section legend { float: left; width: 100%; padding: 12px 0 4px; font-weight: 700; font-size: 13px;
    letter-spacing: .06em; text-transform: uppercase; color: var(--primary); }
  fieldset.section legend + * { clear: both; }
  .field { padding: 12px 0; }
  .field + .field { border-top: 1px solid var(--border); }
  .field .label { display: block; font-weight: 600; margin-bottom: 4px; }
  .field .help { font-size: 14px; color: var(--muted); margin: -2px 0 8px; }
  .field .error { color: var(--late); font-size: 14px; margin-top: 6px; font-weight: 500; }
  .field .error:empty { display: none; }
  .req { color: var(--late); }

  input[type=text], input[type=search], input[type=number], input[type=date], input[type=password], select, textarea {
    width: 100%; min-height: 46px; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px;
    background: #fcfcfe; transition: border-color .15s, box-shadow .15s; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(0, 159, 227, .18); background: #fff; }
  textarea { min-height: 92px; resize: vertical; }
  input:disabled, select:disabled, textarea:disabled { background: var(--grey-bg); color: var(--faint); }
  .field.has-error input:not([type=radio]):not([type=checkbox]), .field.has-error select,
  .field.has-error textarea { border-color: var(--late); }
  .field.has-error .choices label { border-color: #eab3b3; }

  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choices label { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; padding: 6px 16px; border: 1.5px solid var(--border); border-radius: 10px; background: #fcfcfe;
    cursor: pointer; user-select: none; transition: background .15s, border-color .15s, color .15s; }
  .choices input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .choices.scale label { min-width: 46px; padding: 6px 8px; font-weight: 600; }
  .choices label:hover { border-color: var(--accent); }
  .choices label:has(input:checked) { border-color: var(--primary); background: var(--primary); color: #fff; font-weight: 600; }
  .choices label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
  .choices label:has(input:disabled) { opacity: .45; cursor: default; }
  .scale-ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--faint); margin-top: 4px; max-width: 560px; }

  .na { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; color: var(--muted);
    cursor: pointer; min-height: 32px; }
  .na input { width: 18px; height: 18px; accent-color: var(--primary); }

  .form-actions { display: flex; gap: 10px; flex-wrap: wrap; position: sticky; bottom: 0; padding: 12px 0;
    background: linear-gradient(rgba(244, 245, 249, 0), var(--bg) 30%); }
  .form-actions .primary { min-width: 160px; box-shadow: 0 4px 12px rgba(38, 25, 85, .25); }

  /* ---------- modal ---------- */
  .modal { position: fixed; inset: 0; background: rgba(20, 14, 45, .5); display: flex; align-items: center;
    justify-content: center; padding: 16px; z-index: 10; }
  .modal-box { background: var(--card); border-radius: 16px; padding: 22px; max-width: 460px; width: 100%;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .25); }
  .modal-box p { color: var(--muted); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

  .denied { padding-top: 48px; }
  .pin { padding-top: 32px; }
  .pin-card { max-width: 400px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .pin-card h1, .pin-card p { margin: 0; }
  #pin-input { font-size: 24px; letter-spacing: .4em; text-align: center; }
  .pin-error { color: var(--late); font-size: 14px; font-weight: 500; white-space: pre-line; }
  .pin-error:empty { display: none; }
  .denied-card { max-width: 520px; margin: 0 auto; padding: 24px; }

  /* ---------- ÚVN study additions ---------- */
  .pin-logo { max-width: 400px; margin: 0 auto 20px; padding: 18px 22px; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); }
  .pin-logo svg { width: 100%; height: auto; }
  .tp-badge.qol { background: var(--accent); }
  .tp-badge.event { background: #8a3b8f; }
  .tp-badge.end { background: var(--grey); }
  .eye-id { font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
  .pt-item .pt-id { min-width: 86px; }
  .pt-status { flex: none; }
  .avatar.eye { font-size: 18px; letter-spacing: .02em; }
  .head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; flex-wrap: wrap; }
  .rows li + li { border-top: 1px solid var(--border); }
  .rows .detail { font-size: 14px; color: var(--muted); }
  .eye-heading { display: flex; align-items: center; gap: 10px; margin: 28px 0 12px; }
  .eye-heading h2 { font-size: 20px; }
  details.record { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); margin: 0 0 10px; }
  details.record > summary { list-style: none; cursor: pointer; padding: 12px 18px; display: flex; align-items: center;
    gap: 10px; flex-wrap: wrap; }
  details.record > summary::-webkit-details-marker { display: none; }
  details.record > summary::after { content: '▸'; margin-left: auto; color: var(--faint); }
  details.record[open] > summary::after { content: '▾'; }
  details.record > .record-body { padding: 0 18px 14px; }
  details.record.empty-record > summary { cursor: default; }
  details.record.empty-record > summary::after { content: ''; }
  .summary-title { font-weight: 600; }
  .summary-detail { color: var(--muted); font-size: 14px; }
  .masked { border: 1px dashed var(--border); background: var(--grey-bg); color: var(--muted); font-weight: 500;
    min-height: 30px; padding: 2px 10px; font-size: 13px; border-radius: 8px; }
  .codes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .codes button { min-height: 34px; padding: 3px 10px; font-size: 13.5px; border-radius: 8px; }
  .codes button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
  .input-short { max-width: 220px; }

  /* colour-coded answers (questionnaire): tone-1 worst (red) … tone-5 best (green), tone-n neutral */
  .choices.toned label { --tone: var(--grey); --tone-bg: var(--grey-bg); border-color: var(--tone); background: var(--tone-bg);
    color: var(--tone); font-weight: 600; text-align: center; }
  .choices.toned label.tone-1 { --tone: #b42d2d; --tone-bg: #fbe8e8; }
  .choices.toned label.tone-2 { --tone: #b8541a; --tone-bg: #fcefe4; }
  .choices.toned label.tone-3 { --tone: #8a6100; --tone-bg: #fdf5dc; }
  .choices.toned label.tone-4 { --tone: #4f7d2f; --tone-bg: #eef6e6; }
  .choices.toned label.tone-5 { --tone: #237a4b; --tone-bg: #e3f5ea; }
  .choices.toned label.tone-n { --tone: #5a5d72; --tone-bg: #f1f2f6; border-style: dashed; }
  .choices.toned label:hover { border-color: var(--tone); filter: brightness(.97); }
  .choices.toned label:has(input:checked) { background: var(--tone); border-color: var(--tone); color: #fff;
    box-shadow: 0 0 0 3px var(--tone-bg); }

  @media (max-width: 520px) {
    h1 { font-size: 22px; }
    .user { display: none; }
    .brand-sub { display: none; }
    #brand-title { font-size: 15px; }
    #sheet-link { display: none !important; }
    .topbar-inner { padding: 8px 12px; }
  }
</style>

  <script>
'use strict';
(function () {

    waiting: 'Čeká', missed: 'Zmeškáno', ended: 'Ukončeno', not_applicable: 'Neplatí', unknown: 'Neznámý'
  };
  var EYE_TEXT = { OD: 'pravé oko', OS: 'levé oko' };

  /* Static, trusted SVG icons (never user data). */

    userPlus: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1M19 8v6M16 11h6"/></svg>',
    eyePlus: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="11" cy="12" r="2.5"/><path d="M20 17v6M17 20h6"/></svg>',
    clipboard: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 2h6v4H9zM9 12l2 2 4-4M9 18h6"/></svg>',
    search: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
    back: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    chevron: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',

    sheet: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>',
    chart: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
    idCard: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="11" r="2.5"/><path d="M4.5 16.5a3.5 3.5 0 0 1 7 0M14 10h5M14 14h4"/></svg>',
    clock: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>'
  };

  var state = {
    init: null, home: null, dueFilter: 'all', patients: [], nextId: '', pickerMode: 'eye',
    eyeId: null, form: null, returnTo: 'home', saving: false, dirty: false, view: null
  };

  function $(id) { return document.getElementById(id); }

  /** Builds DOM nodes; all text goes through textContent, never innerHTML. */
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'text') node.textContent = v;
      else if (k === 'class') node.className = v;
      else if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? '' : String(v));
    });
    (children || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }

  function icon(name, cls) {
    var span = el('span', { class: cls || null, 'aria-hidden': 'true' });
    span.innerHTML = ICONS[name] || ''; // constant markup only
    return span;
  }
  function fillIcons(root) {
    (root || document).querySelectorAll('[data-icon]').forEach(function (n) {
      if (!n.firstChild || n.firstChild.nodeType === 3) n.insertAdjacentHTML('afterbegin', ICONS[n.getAttribute('data-icon')] || '');
    });
  }

  /* ---------- Czech date and number formatting ---------- */

  function parseIso(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
    return m ? { y: +m[1], m: +m[2], d: +m[3] } : null;
  }
  function fmtDate(iso) { var p = parseIso(iso); return p ? p.d + '. ' + p.m + '. ' + p.y : (iso || ''); }
  function fmtShort(iso) { var p = parseIso(iso); return p ? p.d + '. ' + p.m + '.' : (iso || ''); }
  function fmtStamp(s) { var t = /\d{2}:\d{2}$/.exec(s || ''); return fmtDate(s) + (t ? ' ' + t[0] : ''); }
  function fmtLong(iso) {
    var p = parseIso(iso);
    if (!p) return '';
    return new Date(p.y, p.m - 1, p.d).toLocaleDateString('cs-CZ', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }
  function fmtNum(n) { return String(n).replace('.', ','); }
  function dayDiff(fromIso, toIso) {
    var a = parseIso(fromIso), b = parseIso(toIso);
    return Math.round((Date.UTC(b.y, b.m - 1, b.d) - Date.UTC(a.y, a.m - 1, a.d)) / 86400000);
  }
  function addDays(iso, n) {
    var p = parseIso(iso);
    return new Date(Date.UTC(p.y, p.m - 1, p.d) + n * 86400000).toISOString().slice(0, 10);
  }
  function plural(n, one, few, many) { return n === 1 ? one : (n >= 2 && n <= 4 ? few : many); }
  function inDays(n) { return n === 0 ? 'dnes' : n === 1 ? 'zítra' : 'za ' + n + ' ' + plural(n, 'den', 'dny', 'dní'); }
  function daysAgo(n) { return n === 0 ? 'dnes' : n === 1 ? 'včera' : 'před ' + n + ' ' + plural(n, 'dnem', 'dny', 'dny'); }
  function relDay(iso, today) { var d = dayDiff(today, iso); return d >= 0 ? inDays(d) : daysAgo(-d); }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  /**
   * Where today is relative to a visit's window, e.g.
   * "cíl 17. 11. (za 2 dny) · okno do 24. 11. (zbývá 9 dní)".
   */
  function windowText(status, w, today, code) {
    if (status === 'waiting') return code === 'QOL' ? 'čeká na operaci všech studijních očí' : waitingText(code);
    if (status === 'missed') return 'nelze doplnit, už proběhla pozdější návštěva';
    if (status === 'ended') return 'účast oka byla ukončena';
    if (status === 'not_applicable') return 'účast všech očí byla ukončena';
    if (!w) return '';
    if (!w.end) {
      if (status === 'overdue') return 'chybí – oko už bylo operováno';
      return 'od ' + fmtShort(w.start) + ' (' + relDay(w.start, today) + ')';
    }
    var target = 'cíl ' + fmtShort(w.target) + ' (' + relDay(w.target, today) + ')';
    if (status === 'overdue') return 'okno skončilo ' + fmtShort(w.end) + ' (' + daysAgo(dayDiff(w.end, today)) + ') · cíl ' + fmtShort(w.target);
    if (status === 'due') {
      var left = dayDiff(today, w.end);
      return target + ' · okno do ' + fmtShort(w.end) + ' (' +
        (left === 0 ? 'poslední den' : 'zbývá ' + left + ' ' + plural(left, 'den', 'dny', 'dní')) + ')';
    }
    return 'okno od ' + fmtShort(w.start) + ' (' + inDays(dayDiff(today, w.start)) + ') · ' + target;
  }
  function waitingText(code) {
    var tp = findTp(code);
    if (tp && tp.anchor === 'planned_surgery') return 'čeká na plánované datum operace (zapisuje se při předoperačním vyšetření)';
    return 'čeká na operaci; okno se počítá od data operace';
  }
  function findTp(code) {
    return ((state.init && state.init.timepoints) || []).filter(function (t) { return t.code === code; })[0] || null;
  }

  /* Sequential ramp from ÚVN cyan to ÚVN navy: later visits get darker badges (white text stays readable). */
  var TP_RAMP = [[0, 120, 180], [38, 25, 85]];
  /** Coloured badge with the visit code; its colour follows the order in the Timepoints tab. */
  function tpBadge(code) {
    if (code === 'QOL') return el('span', { class: 'tp-badge qol', title: 'Dotazník', text: 'DOT' });
    if (code === 'AE') return el('span', { class: 'tp-badge event', title: 'Nežádoucí příhoda / zákrok', text: 'NP' });
    if (code === 'END') return el('span', { class: 'tp-badge end', title: 'Ukončení účasti', text: 'UK' });
    var tps = (state.init && state.init.timepoints) || [];
    var i = tps.map(function (t) { return t.code; }).indexOf(code);
    var t = tps.length > 1 && i >= 0 ? i / (tps.length - 1) : 0.5;
    var rgb = TP_RAMP[0].map(function (c, j) { return Math.round(c + (TP_RAMP[1][j] - c) * t); });
    var label = i >= 0 ? tps[i].label : code;
    return el('span', { class: 'tp-badge', title: label, style: 'background:rgb(' + rgb.join(',') + ')', text: code });
  }
  function chip(status) { return el('span', { class: 'chip ' + status, text: STATUS_TEXT[status] || status }); }

  /* ---------- server calls and the remembered sign-in ---------- */

  /** The Apps Script web app (/exec); written into the page by scripts/build-web.mjs. */
  var API_URL = document.querySelector('meta[name="api-url"]').content;
  var SESSION_KEY = 'uvnClareonToric.session';

  /** The signed session from apiLogin, kept on this device (storage may be unavailable). */
  function loadSession() {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { return null; }
  }
  function saveSession(s) {
    try { if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(SESSION_KEY); } catch (e) { /* memory only */ }
    session = s;
  }
  var session = loadSession();

  /**
   * POST {fn, args, session} to the web app. No cookies are sent (credentials: 'omit'), so the
   * Google accounts signed in to this browser don't matter. text/plain avoids a CORS preflight.
   * Always resolves to {ok, data, errors}.
   */
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return fetch(API_URL, {
      method: 'POST',
      credentials: 'omit',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args, session: fn === 'apiLogin' ? null : session })
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (res) {
      return res || { ok: false, errors: [{ message: 'Server nevrátil žádnou odpověď.' }] };
    }, function (err) {
      return { ok: false, errors: [{ message: 'Nepodařilo se spojit se serverem (' + (err && err.message || err) +
        '). Zkontrolujte připojení a zkuste to znovu.' }] };
    }).then(function (res) {
      if (res.denied && fn !== 'apiLogin') showLogin('Přihlášení vypršelo nebo bylo zrušeno. Zadejte PIN znovu.');
      return res;
    });
  }

  function newSubmissionId() {
    var a = new Uint8Array(12);
    (window.crypto || window.msCrypto).getRandomValues(a);
    return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }

  /* ---------- views, messages, dialog ---------- */

  function show(view) {
    state.view = view;
    ['pin', 'home', 'checkup', 'form'].forEach(function (v) { $('view-' + v).hidden = v !== view; });
    window.scrollTo(0, 0);
  }

  function banner(kind, message) {
    var b = $('banner');
    b.className = 'banner ' + kind;
    b.textContent = message;
    b.hidden = false;
    if (kind === 'error') b.scrollIntoView({ block: 'nearest' });
  }
  function clearBanner() { $('banner').hidden = true; }

  function showServerErrors(res) {
    if (res.denied) return; // the PIN screen is already shown (see call)
    var general = [];
    (res.errors || []).forEach(function (e) {
      if (!(e.field && state.form && setFieldError(e.field, e.message))) general.push(e.message);
    });
    banner('error', general.length ? general.join('\n') : 'Opravte prosím zvýrazněná pole.');
    focusFirstError();
  }

  function confirmDialog(title, text, okLabel) {
    return new Promise(function (resolve) {
      $('modal-title').textContent = title;
      $('modal-text').textContent = text;
      $('modal-ok').textContent = okLabel || 'OK';
      $('modal').hidden = false;
      $('modal-ok').focus();
      function done(result) {
        $('modal').hidden = true;
        $('modal-ok').onclick = $('modal-cancel').onclick = null;
        resolve(result);
      }
      $('modal-ok').onclick = function () { done(true); };
      $('modal-cancel').onclick = function () { done(false); };
    });
  }

  /** Only https links to Google Docs are accepted (the URL comes from the server). */
  function setLink(id, url) {
    var a = $(id);
    if (url && /^https:\/\/docs\.google\.com\//.test(url)) { a.href = url; a.hidden = false; }
  }

  function busy(on) { $('loading').hidden = !on; }

  async function confirmLeave() {
    if (!state.form || !state.dirty) return true;
    return confirmDialog('Zahodit změny?', 'Neuložené odpovědi budou ztraceny.', 'Zahodit');
  }

  /* ---------- start / home ---------- */

  async function start() {
    fillIcons();
    if (session) {
      var res = await call('apiInit');
      busy(false);
      if (res.ok) { initApp(res.data); return; }
      if (!res.denied) { showLogin(''); banner('error', (res.errors || []).map(function (m) { return m.message; }).join('\n')); }
      return;
    }
    busy(false);
    showLogin('');
  }

  function showLogin(message) {
    saveSession(null);
    state.init = state.form = null;
    state.dirty = false;
    ['sheet-link', 'dashboard-link', 'logout'].forEach(function (id) { $(id).hidden = true; });
    $('user-email').textContent = '';
    clearBanner();
    busy(false);
    show('pin');
    $('pin-input').value = '';
    $('pin-error').textContent = message || '';
    $('pin-input').focus();
  }

  async function submitPin(e) {
    e.preventDefault();
    if ($('pin-submit').disabled) return; // a check is already running
    var pin = $('pin-input').value.replace(/\D/g, '');
    $('pin-error').textContent = '';
    clearBanner();
    if (pin.length !== 6) { $('pin-error').textContent = 'PIN má 6 číslic.'; $('pin-input').focus(); return; }
    $('pin-submit').disabled = true;
    busy(true);
    var res = await call('apiLogin', pin); // returns the start-up data too
    busy(false);
    $('pin-submit').disabled = false;
    if (!res.ok) {
      $('pin-input').value = '';
      $('pin-error').textContent = (res.errors || []).map(function (m) { return m.message; }).join('\n');
      $('pin-input').focus();
      return;
    }
    initApp(res.data);
  }

  async function logout() {
    if (state.saving || !(await confirmLeave())) return;
    showLogin('');
  }

  function initApp(data) {
    if (data.session) saveSession(data.session); // renewed on every start
    state.init = data;
    $('logout').hidden = false;
    document.title = data.appTitle;
    $('brand-title').textContent = data.appTitle;
    $('home-title').textContent = data.appTitle;
    $('user-email').textContent = data.user;
    setLink('sheet-link', data.spreadsheetUrl);
    setLink('dashboard-link', data.dashboardUrl);
    $('checkup-sub').textContent = 'Návštěvy ' + data.timepoints.map(function (t) { return t.code; }).join(' · ') + ', příhody, ukončení';
    applyOverview(data.overview);
    goHome(null, true);
  }

  /* ---------- the overview: cached in memory, refreshed in the background ---------- */

  /**
   * Home list + every patient with their eyes' visit statuses (see overview_ on the server).
   * Screens are drawn from this copy at once; it comes with start-up and with every save, and
   * is refreshed quietly whenever the home screen or a picker is opened.
   */
  function applyOverview(ov) {
    state.home = { today: ov.today, soonDays: ov.soonDays, stats: ov.stats, items: ov.items };
    state.patients = ov.patients;
    state.nextId = ov.nextPatientId;
    state.init.today = ov.today;
  }

  var refreshing = null;
  function refreshOverview() {
    if (refreshing) return refreshing;
    refreshing = call('apiOverview').then(function (res) {
      refreshing = null;
      if (!res.ok || !state.init) return; // keep the copy we have; errors show up on the next action
      applyOverview(res.data);
      redrawFromOverview();
    });
    return refreshing;
  }

  /** Redraws the screen on display with fresh data, without disturbing what the user is doing. */
  function redrawFromOverview() {
    if (state.view === 'home') renderHome();
    else if (state.view === 'checkup' && !$('pt-results').hidden) renderResults($('pt-search').value);
    else if (state.view === 'checkup' && state.pickerMode === 'eye' && state.eyeId && findEye(state.eyeId)) renderEye(state.eyeId);
  }

  function findPatient(pid) {
    pid = String(pid || '').trim().toUpperCase();
    return state.patients.filter(function (p) { return p.id === pid; })[0] || null;
  }
  /** {patient, eye} for "T001-OD", or null. */
  function findEye(eyeId) {
    var m = /^(.+)-(OD|OS)$/.exec(String(eyeId || '').trim().toUpperCase());
    var p = m && findPatient(m[1]);
    var e = p && p.eyes.filter(function (x) { return x.eye === m[2]; })[0];
    return e ? { patient: p, eye: e } : null;
  }
  function otherEye(eye) { return eye === 'OD' ? 'OS' : 'OD'; }

  /** @param {boolean} fresh  the overview was just received, no need to refresh it */
  function goHome(message, fresh) {
    clearBanner();
    state.form = null;
    state.dirty = false;
    state.eyeId = null;
    show('home');
    renderHome();
    if (message) banner(message.kind, message.text);
    if (!fresh) refreshOverview();
  }

  function renderHome() {
    $('today-text').textContent = fmtLong(state.home.today);
    renderDueFilters();
    renderDue();
  }

  function renderDueFilters() {
    var s = state.home.stats;
    var defs = [['all', 'Vše', s.overdue + s.due + s.soon], ['overdue', 'Po termínu', s.overdue], ['due', 'K provedení', s.due],
      ['soon', 'Brzy', s.soon]];
    var box = $('due-filters');
    box.textContent = '';
    defs.forEach(function (d) {
      box.appendChild(el('button', {
        type: 'button', role: 'tab', 'aria-selected': state.dueFilter === d[0] ? 'true' : 'false',
        onclick: function () { state.dueFilter = d[0]; renderDueFilters(); renderDue(); }
      }, [d[1], el('span', { class: 'count', text: '(' + d[2] + ')' })]));
    });
  }

  function renderDue() {
    var list = $('due-list');
    list.textContent = '';
    var today = state.home.today;
    var all = state.dueFilter === 'all';
    var items = state.home.items.filter(function (it) { return all || it.status === state.dueFilter; });
    if (!items.length) {
      list.appendChild(el('li', { class: 'empty', text: all ? 'Teď nic nečeká na zápis.' : 'Nic v této kategorii.' }));
      return;
    }
    // "Vše" is split into sections by status; a single filter is one plain list
    (all ? ['overdue', 'due', 'soon'] : [state.dueFilter]).forEach(function (status) {
      var group = items.filter(function (it) { return it.status === status; });
      if (!group.length) return;
      if (all) list.appendChild(el('li', { class: 'due-group ' + status }, [STATUS_TEXT[status], el('span', { class: 'count', text: ' (' + group.length + ')' })]));
      group.forEach(function (it) {
        var who = it.eyeId || it.patientId;
        list.appendChild(el('li', null, [
          el('button', { type: 'button', class: 'due-item', onclick: function () {
            openForm(it.code, { patientId: it.patientId, eyeId: it.eyeId }, 'home');
          } }, [
            tpBadge(it.code),
            el('span', { class: 'due-main' }, [
              el('div', { class: 'who' }, [who + ' ', el('span', { text: [it.eye ? EYE_TEXT[it.eye] : 'pacient', it.label].filter(Boolean).join(' · ') })]),
              el('div', { class: 'what', text: it.tpLabel + ' · ' + windowText(it.status, it.window, today, it.code) })
            ]),
            icon('chevron', 'chev')
          ])
        ]));
      });
    });
  }

  /* ---------- pickers: eyes, patients ---------- */

  var PICKER_TITLES = { eye: 'Zaznamenat návštěvu', addEye: 'Přidat oko', data: 'Data pacienta' };

  /** mode 'eye': eye list -> eye screen; 'addEye': patients with one eye -> registration; 'data': patients -> read-only data. */
  async function openPicker(mode, select, message, fresh) {
    clearBanner();
    state.form = null;
    state.dirty = false;
    state.pickerMode = mode;
    state.eyeId = null;
    $('picker-title').textContent = PICKER_TITLES[mode];
    show('checkup');
    $('pt-panel').hidden = true;
    $('pt-results').hidden = false;
    $('pt-search').value = '';
    renderResults('');
    if (!fresh) refreshOverview();
    if (select) await pick(select);
    else $('pt-search').focus();
    if (message) banner(message.kind, message.text);
  }
  function openEye(eyeId, message, fresh) { return openPicker('eye', eyeId, message, fresh); }

  /** The most pressing thing for an eye, for the picker list. */
  function eyeSummary(e) {
    if (e.ended) return 'ended';
    var order = ['overdue', 'due', 'soon'];
    for (var i = 0; i < order.length; i++) {
      if (e.timepoints.some(function (t) { return t.status === order[i]; })) return order[i];
    }
    if (e.timepoints.every(function (t) { return t.status === 'done' || t.status === 'missed'; })) return 'done';
    return e.timepoints.some(function (t) { return t.status === 'waiting'; }) ? 'waiting' : 'not_yet_due';
  }

  function renderResults(query) {
    var list = $('pt-results');
    list.textContent = '';
    var q = query.trim().toLowerCase();
    var mode = state.pickerMode;
    var rows = [];
    state.patients.forEach(function (p) {
      if (mode === 'eye') {
        p.eyes.forEach(function (e) { rows.push({ key: e.eyeId, search: p.search + ' ' + e.eyeId.toLowerCase(), patient: p, eye: e }); });
      } else if (mode === 'addEye') {
        if (p.eyes.length === 1) rows.push({ key: p.id, search: p.search, patient: p, add: otherEye(p.eyes[0].eye) });
      } else {
        rows.push({ key: p.id, search: p.search, patient: p });
      }
    });
    if (!rows.length) {
      list.appendChild(el('li', { class: 'empty', text: mode === 'addEye' ? 'Žádný pacient nemá jen jedno studijní oko.' : 'Zatím není registrován žádný pacient.' }));
      return;
    }
    var matches = rows.filter(function (r) { return !q || r.search.indexOf(q) >= 0; });
    if (!matches.length) {
      list.appendChild(el('li', { class: 'empty', text: 'Hledání „' + query + '“ nic neodpovídá.' }));
      return;
    }
    matches.slice(0, 150).forEach(function (r) {
      var label, status = null;
      if (r.eye) {
        label = EYE_TEXT[r.eye.eye] + (r.patient.label ? ' · ' + r.patient.label : '');
        status = chip(eyeSummary(r.eye));
      } else if (r.add) {
        label = (r.patient.label ? r.patient.label + ' · ' : '') + 'zařazeno ' + r.patient.eyes[0].eye + ', přidat ' + r.add;
      } else {
        label = [r.patient.label, r.patient.eyes.map(function (e) { return e.eye; }).join(' + ')].filter(Boolean).join(' · ');
      }
      list.appendChild(el('li', null, [
        el('button', { type: 'button', class: 'pt-item', onclick: function () { pick(r.key); } }, [
          el('span', { class: 'pt-id', text: r.key }),
          el('span', { class: 'pt-label', text: label }),
          status ? el('span', { class: 'pt-status' }, [status]) : null,
          icon('chevron', 'chev')
        ])
      ]));
    });
  }

  async function pick(key) {
    clearBanner();
    $('pt-search').value = key;
    $('pt-results').hidden = true;
    if (state.pickerMode === 'eye') {
      if (!findEye(key)) { banner('error', 'Oko ' + key + ' nebylo nalezeno.'); return; }
      state.eyeId = findEye(key).eye.eyeId;
      renderEye(state.eyeId);
      return;
    }
    if (state.pickerMode === 'addEye') {
      var p = findPatient(key);
      if (!p) { banner('error', 'Pacient ' + key + ' nebyl nalezen.'); return; }
      openForm('REG', { patientId: p.id, addEye: p.eyes.length === 1 ? otherEye(p.eyes[0].eye) : null }, 'home');
      return;
    }
    busy(true);
    var res = await call('apiGetPatientData', key);
    busy(false);
    if (!res.ok) { showServerErrors(res); return; }
    renderPatientData(res.data);
  }

  /* ---------- eye screen: visits, events, end of participation, questionnaire ---------- */

  function renderEye(eyeId) {
    var found = findEye(eyeId);
    var panel = $('pt-panel');
    panel.textContent = '';
    if (!found) return;
    var p = found.patient, e = found.eye, today = state.home.today;
    var other = p.eyes.filter(function (x) { return x.eye !== e.eye; })[0];
    var ctx = { patientId: p.id, eyeId: e.eyeId };

    var sub = e.surgeryDate ? 'Operace ' + fmtDate(e.surgeryDate)
      : e.plannedSurgery ? 'Plánovaná operace ' + fmtDate(e.plannedSurgery) : 'Bez data operace';
    panel.appendChild(el('div', { class: 'card' }, [
      el('div', { class: 'person-head' }, [
        el('div', { class: 'person' }, [
          el('div', { class: 'avatar eye', text: e.eye }),
          el('div', null, [
            el('h2', { text: e.eyeId }),
            el('div', { text: cap(EYE_TEXT[e.eye]) + (p.label ? ' · ' + p.label : '') }),
            el('div', { class: 'muted', text: sub + (e.ended ? ' · ukončeno ' + fmtDate(e.ended.date) : '') })
          ])
        ]),
        el('div', { class: 'head-actions' }, [
          el('button', { type: 'button', class: 'small', text: 'Registrace pacienta', onclick: function () { openForm('REG', { patientId: p.id }, 'eye'); } }),
          other
            ? el('button', { type: 'button', class: 'small', text: 'Druhé oko ' + other.eyeId, onclick: function () { openEye(other.eyeId, null, true); } })
            : el('button', { type: 'button', class: 'small', text: 'Přidat ' + otherEye(e.eye), onclick: function () {
              openForm('REG', { patientId: p.id, addEye: otherEye(e.eye) }, 'eye');
            } })
        ])
      ])
    ]));

    // visits
    var list = el('ul', { class: 'timeline' });
    e.timepoints.forEach(function (tp) {
      var detail = tp.status === 'done'
        ? (tp.code === surgeryCode() ? 'Operace ' : 'Návštěva ') + fmtDate(tp.visit.visitDate) + ' · uložil(a) ' + tp.visit.updatedBy + ', ' + fmtStamp(tp.visit.updatedAt)
        : cap(windowText(tp.status, tp.window, today, tp.code));
      var chips = [chip(tp.status)];
      if (tp.visit && tp.visit.inWindow === false) chips.push(' ', el('span', { class: 'chip outside', text: 'Mimo okno' }));
      var tpDef = findTp(tp.code);
      var blocked = tp.status === 'missed' || tp.status === 'ended' || (tp.status === 'waiting' && tpDef && tpDef.anchor === 'surgery');
      var canRecord = tp.visit || !blocked;
      list.appendChild(el('li', null, [
        el('span', { class: 'dot ' + tp.status }),
        el('div', { class: 'tp-body' }, [
          el('div', { class: 'tp-info' }, [
            el('div', null, [tpBadge(tp.code), ' ', el('strong', { text: tp.label })].concat(chips)),
            el('div', { class: 'detail', text: detail })
          ]),
          canRecord ? el('button', {
            type: 'button',
            class: tp.status === 'done' ? 'small' : 'primary small',
            text: tp.status === 'done' ? 'Zobrazit / upravit' : 'Zaznamenat',
            onclick: function () { openForm(tp.code, ctx, 'eye'); }
          }) : null
        ])
      ]));
    });
    panel.appendChild(el('div', { class: 'card' }, [el('div', { class: 'card-title' }, [el('h2', { text: 'Návštěvy' })]), list]));

    // adverse events and secondary surgery
    var evList = el('ul', { class: 'rows' });
    e.events.forEach(function (ev) {
      evList.appendChild(el('li', null, [
        el('div', null, [
          el('div', null, [tpBadge('AE'), ' ', el('strong', { text: ev.typeLabel || ev.type }), ' ', el('span', { class: 'muted', text: fmtDate(ev.date) })]),
          el('div', { class: 'detail', text: ev.id })
        ]),
        el('button', { type: 'button', class: 'small', text: 'Zobrazit / upravit', onclick: function () { openForm('AE', Object.assign({ recordId: ev.id }, ctx), 'eye'); } })
      ]));
    });
    panel.appendChild(el('div', { class: 'card' }, [
      el('div', { class: 'card-title' }, [el('h2', { text: 'Nežádoucí příhody a zákroky' })]),
      e.events.length ? evList : el('div', { class: 'detail', text: 'Zatím žádný záznam. Sem patří i repozice IOL a jiné sekundární zákroky.' }),
      el('div', { class: 'card-actions' }, [
        el('button', { type: 'button', class: 'small', text: 'Přidat záznam', onclick: function () { openForm('AE', ctx, 'eye'); } })
      ])
    ]));

    // questionnaire (patient level)
    var q = p.qol;
    panel.appendChild(el('div', { class: 'card' }, [
      el('div', { class: 'card-title' }, [el('h2', null, [tpBadge('QOL'), ' Dotazník pacienta']), chip(q.status)]),
      el('div', { class: 'detail', text: q.status === 'done' ? 'Vyplněn ' + fmtDate(q.date) + '. Jeden dotazník na pacienta.'
        : cap(windowText(q.status, q.window, today, 'QOL')) + '. Jeden dotazník na pacienta, při kontrole po 3 měsících později operovaného oka.' }),
      q.status === 'not_applicable' ? null : el('div', { class: 'card-actions' }, [
        el('button', { type: 'button', class: q.status === 'due' || q.status === 'overdue' ? 'primary small' : 'small',
          text: q.status === 'done' ? 'Zobrazit / upravit' : 'Zaznamenat dotazník', onclick: function () { openForm('QOL', { patientId: p.id }, 'eye'); } })
      ])
    ]));

    // end of participation
    panel.appendChild(el('div', { class: 'card' + (e.ended ? '' : ' card-empty') }, [
      el('div', { class: 'card-title' }, [el('h2', null, [tpBadge('END'), ' Ukončení účasti oka']), e.ended ? chip('ended') : null]),
      el('div', { class: 'detail', text: e.ended ? fmtDate(e.ended.date) + ' · ' + e.ended.reasonLabel
        : 'Jen pokud oko nemůže ve studii pokračovat (nesplnilo kritéria, odvolání souhlasu, ztráta ze sledování…).' }),
      el('div', { class: 'card-actions' }, [
        el('button', { type: 'button', class: 'small', text: e.ended ? 'Zobrazit / upravit' : 'Ukončit účast oka', onclick: function () { openForm('END', ctx, 'eye'); } })
      ])
    ]));
    panel.hidden = false;
  }
  function surgeryCode() {
    var tp = ((state.init && state.init.timepoints) || []).filter(function (t) { return t.anchor === 'planned_surgery'; })[0];
    return tp ? tp.code : '';
  }

  /* ---------- patient data (read only) ---------- */

  function isMasked(fid) { return (state.init.maskedFields || []).indexOf(fid) >= 0; }

  function displayValue(field, v) {
    v = v === null || v === undefined ? '' : String(v);
    if (v === '') return '—';
    if (v === NA) return 'N/A';
    if (field.type === 'date') return fmtDate(v);
    if (field.optionLabels && field.optionLabels[v]) return field.optionLabels[v] === v ? v : field.optionLabels[v];
    if (NUMBER_TYPES.indexOf(field.type) >= 0) return fmtNum(v);
    return v;
  }

  /** Answers as a label/value list, grouped by section; questions hidden by show_if are left out. */
  function answersList(rec) {
    var vis = computeVisibility(rec.fields, rec.values);
    var box = el('div', { class: 'answers' });
    var section = null;
    rec.fields.forEach(function (f) {
      if (!vis[f.id]) return;
      if (f.section && f.section !== section) {
        section = f.section;
        box.appendChild(el('div', { class: 'answers-section', text: section }));
      }
      var v = displayValue(f, rec.values[f.id]);
      var value = el('div', { class: 'a' + (v === '—' || v === 'N/A' ? ' empty-value' : ''), text: v });
      if (isMasked(f.id) && v !== '—') {
        value = el('div', { class: 'a' }, [el('button', { type: 'button', class: 'masked', text: 'skryto – zobrazit',
          title: 'Osa se zobrazí až na kliknutí, aby neovlivnila odečet při další kontrole.',
          onclick: function (ev) { ev.target.replaceWith(document.createTextNode(v)); } })]);
      }
      box.appendChild(el('div', { class: 'answer' }, [el('div', { class: 'q', text: f.label }), value]));
    });
    return box;
  }

  function metaLine(meta) {
    var parts = ['Zapsal(a) ' + meta.enteredBy + ', ' + fmtStamp(meta.createdAt)];
    if (meta.updatedAt && meta.updatedAt !== meta.createdAt) parts.push('naposledy upravil(a) ' + meta.updatedBy + ', ' + fmtStamp(meta.updatedAt));
    return el('div', { class: 'detail meta', text: parts.join(' · ') });
  }

  /** A collapsible record: summary line (badge, title, chips, detail) and its answers. */
  function recordBox(badge, title, chips, detail, rec, open) {
    var summary = el('summary', null, [badge, el('span', { class: 'summary-title', text: title })].concat(chips || [],
      [detail ? el('span', { class: 'summary-detail', text: detail }) : null]));
    if (!rec) return el('details', { class: 'record empty-record' }, [summary]);
    return el('details', { class: 'record', open: open || null }, [summary, el('div', { class: 'record-body' }, [metaLine(rec.meta), answersList(rec)])]);
  }

  function renderPatientData(d) {
    var panel = $('pt-panel');
    panel.textContent = '';
    var p = d.patient, today = d.today;
    panel.appendChild(el('div', { class: 'card' }, [
      el('div', { class: 'person-head' }, [
        el('div', { class: 'person' }, [
          el('div', { class: 'avatar', text: p.id.slice(0, 4) }),
          el('div', null, [
            el('h2', { text: p.id }),
            el('div', { text: [p.label, 'oči ' + p.eyes.map(function (e) { return e.eye; }).join(' + ')].filter(Boolean).join(' · ') }),
            el('div', { class: 'muted', text: 'Jen pro čtení. Osy se zobrazí po kliknutí.' })
          ])
        ])
      ])
    ]));
    panel.appendChild(recordBox(tpBadge('REG'), 'Registrace pacienta', null, fmtDate(p.registrationDate), d.registration, false));
    panel.appendChild(recordBox(tpBadge('QOL'), 'Dotazník', [chip(d.qol.status)],
      d.qol.record ? fmtDate(d.qol.record.values.qol_date) : windowText(d.qol.status, d.qol.window, today, 'QOL'), d.qol.record, false));

    d.eyes.forEach(function (e) {
      panel.appendChild(el('div', { class: 'eye-heading' }, [el('div', { class: 'avatar eye', text: e.eye }),
        el('h2', { text: e.eyeId + ' · ' + EYE_TEXT[e.eye] })]));
      e.timepoints.forEach(function (tp) {
        var chips = [chip(tp.status)];
        if (tp.visit && tp.visit.inWindow === false) chips.push(el('span', { class: 'chip outside', text: 'Mimo okno' }));
        var detail = tp.visit
          ? fmtDate(tp.visit.values.visit_date) + (tp.visit.daysSinceSurgery !== null && tp.code !== surgeryCode() ? ' · den ' + tp.visit.daysSinceSurgery + ' od operace' : '')
          : windowText(tp.status, tp.window, today, tp.code);
        panel.appendChild(recordBox(tpBadge(tp.code), tp.label, chips, detail, tp.visit, false));
      });
      e.events.forEach(function (ev) {
        var f = ev.fields.filter(function (x) { return x.id === 'event_type'; })[0];
        panel.appendChild(recordBox(tpBadge('AE'), f ? displayValue(f, ev.values.event_type) : 'Příhoda', null,
          fmtDate(ev.values.event_date) + ' · ' + ev.id, ev, false));
      });
      if (e.ending) panel.appendChild(recordBox(tpBadge('END'), 'Ukončení účasti', [chip('ended')], fmtDate(e.ending.values.end_date), e.ending, false));
    });
    panel.hidden = false;
  }

  /* ---------- form ---------- */

  /**
   * A new record is built from the form definitions and the overview, without a request;
   * editing saved answers loads them from the server. (If someone else saved the same record
   * meanwhile, the server refuses the duplicate on save.)
   */
  function newRecordForm(code, ctx) {
    var def = state.init.forms[code], today = state.home.today;
    if (!def) return null;
    var base = { form: code, kind: def.kind, formLabel: def.label, fields: def.fields, version: null, mode: 'create', meta: null,
      today: today, recordId: '', eyeId: '', eye: '', window: null, patient: null, submissionId: newSubmissionId() };
    if (code === 'REG') {
      if (ctx.patientId) return null;
      return Object.assign(base, { values: { patient_id: state.nextId, registration_date: today } });
    }
    if (def.kind === 'QOL') {
      var pq = findPatient(ctx.patientId);
      if (!pq || pq.qol.status === 'done') return null;
      return Object.assign(base, { patient: pq, values: { qol_date: today } });
    }
    var found = findEye(ctx.eyeId);
    if (!found) return null;
    Object.assign(base, { patient: found.patient, eyeId: found.eye.eyeId, eye: found.eye.eye });
    if (def.kind === 'AE') return ctx.recordId ? null : Object.assign(base, { values: { event_date: today } });
    if (def.kind === 'END') return found.eye.ended ? null : Object.assign(base, { values: { end_date: today } });
    var tp = found.eye.timepoints.filter(function (t) { return t.code === code; })[0];
    if (!tp || tp.visit) return null;
    return Object.assign(base, { values: { visit_date: today }, window: tp.window });
  }

  /**
   * @param {{patientId?:string, eyeId?:string, recordId?:string, addEye?:string}} ctx
   * @param {'home'|'eye'} returnTo
   */
  async function openForm(code, ctx, returnTo) {
    clearBanner();
    ctx = ctx || {};
    var form = newRecordForm(code, ctx);
    if (!form) {
      busy(true);
      var res = await call('apiGetForm', { form: code, patientId: ctx.patientId || null, eyeId: ctx.eyeId || null, recordId: ctx.recordId || null });
      busy(false);
      if (!res.ok) { showServerErrors(res); return; }
      form = res.data;
      if (form.mode === 'create') form.submissionId = newSubmissionId();
    }
    form.addEye = code === 'REG' && ctx.addEye ? ctx.addEye : null;
    state.form = form;
    state.returnTo = returnTo || 'home';
    state.returnEye = ctx.eyeId || state.eyeId || null;
    state.dirty = false;
    renderForm();
    show('form');
    if (form.addEye) {
      var fid = 'study_eye_' + form.addEye.toLowerCase();
      var fdef = form.fields.filter(function (f) { return f.id === fid; })[0];
      if (fdef && getFieldValue(fdef) !== 'yes') {
        setFieldValue(fdef, 'yes');
        state.dirty = true;
        updateVisibility();
        banner('info', 'Zaškrtnuto: ' + EYE_TEXT[form.addEye] + ' (' + form.addEye + ') je zařazeno do studie. Zkontrolujte a uložte.');
      }
    }
  }

  function formTitle(f) {
    var pid = f.patient ? f.patient.id : '';
    if (f.form === 'REG') {
      if (f.addEye) return 'Přidat oko – ' + pid;
      return f.mode === 'edit' ? 'Registrace pacienta – ' + pid : 'Registrace pacienta';
    }
    if (f.kind === 'QOL') return pid + ' · ' + f.formLabel;
    var title = f.eyeId + ' · ' + f.formLabel;
    if (f.kind === 'AE' && f.recordId) title += ' ' + f.recordId;
    return title + (f.mode === 'edit' && f.kind !== 'AE' ? ' (úprava)' : '');
  }

  function renderForm() {
    var f = state.form;
    $('form-title').textContent = formTitle(f);

    var sub = $('form-subtitle');
    sub.textContent = '';
    if (f.eye) sub.appendChild(el('span', { text: cap(EYE_TEXT[f.eye]) }));
    if (f.patient && f.patient.label) sub.appendChild(el('span', { text: f.patient.label }));
    if (f.window) {
      var w = f.window;
      sub.appendChild(el('span', null, [icon('calendar'), w.end
        ? 'Okno ' + fmtShort(w.start) + ' – ' + fmtDate(w.end) + ' (cíl ' + fmtShort(w.target) + ')'
        : 'Od ' + fmtDate(w.start)]));
    }
    if (f.meta) sub.appendChild(el('span', null, [icon('clock'), 'Naposledy uložil(a) ' + f.meta.updatedBy + ', ' + fmtStamp(f.meta.updatedAt)]));
    sub.hidden = !sub.firstChild;

    var form = $('data-form');
    form.textContent = '';
    var fieldset = null, section = null;
    f.fields.forEach(function (field) {
      if (!fieldset || field.section !== section) {
        section = field.section;
        fieldset = el('fieldset', { class: 'section' }, section ? [el('legend', { text: section })] : []);
        form.appendChild(fieldset);
      }
      fieldset.appendChild(renderField(field));
    });
    f.fields.forEach(function (field) { setFieldValue(field, f.values[field.id]); });
    var idInput = f.form === 'REG' ? $('f_patient_id') : null;
    if (idInput) {
      idInput.disabled = true; // assigned automatically by the server; never editable
      idInput.title = f.mode === 'edit' ? 'Kód pacienta nelze změnit.' : 'Kód se přidělí automaticky při uložení.';
    }
    updateVisibility();
    $('btn-save').textContent = f.mode === 'edit' ? 'Uložit změny' : 'Uložit';
  }

  function renderField(field) {
    var id = 'f_' + field.id;
    var isGroup = GROUP_TYPES.indexOf(field.type) >= 0;
    var wrap = el('div', { class: 'field', 'data-field': field.id });
    var labelChildren = [field.label, field.required ? el('span', { class: 'req', text: ' *' }) : null];
    wrap.appendChild(isGroup
      ? el('div', { class: 'label', id: id + '_label' }, labelChildren)
      : el('label', { class: 'label', for: id }, labelChildren));
    if (field.help) wrap.appendChild(el('div', { class: 'help', id: id + '_help', text: field.help }));
    var described = field.help ? id + '_help ' + id + '_error' : id + '_error';
    var labelOf = function (o) { return (field.optionLabels && field.optionLabels[o]) || o; };

    var control, extra = null;
    switch (field.type) {
      case 'textarea':
        control = el('textarea', { id: id, name: field.id, rows: 3, maxlength: field.max || 5000, 'aria-describedby': described });
        break;
      case 'integer':
      case 'number': {
        // text input: Czech decimal commas are accepted and checked in validateClient()
        var range = field.min !== null && field.max !== null ? fmtNum(field.min) + ' až ' + fmtNum(field.max) : '';
        control = el('input', { id: id, name: field.id, type: 'text', class: 'input-short', placeholder: range || null,
          inputmode: field.type === 'integer' && !(field.min < 0) ? 'numeric' : 'decimal', 'aria-describedby': described });
        if (field.options && field.options.length) {
          extra = el('div', { class: 'codes', role: 'group', 'aria-label': 'Kódy' }, field.options.map(function (o) {
            return el('button', { type: 'button', 'data-code': o, 'aria-pressed': 'false', text: labelOf(o), onclick: function () {
              var input = $(id);
              input.value = input.value === o ? '' : o;
              input.dispatchEvent(new Event('input', { bubbles: true }));
            } });
          }));
        }
        break;
      }
      case 'date': {
        var maxDate = addDays(state.form.today, field.max || 0);
        control = el('input', { id: id, name: field.id, type: 'date', max: maxDate, class: 'input-short', 'aria-describedby': described });
        break;
      }
      case 'select':
        control = el('select', { id: id, name: field.id, 'aria-describedby': described },
          [el('option', { value: '', text: '— vyberte —' })].concat(field.options.map(function (o) {
            return el('option', { value: o, text: labelOf(o) });
          })));
        break;
      case 'radio':
      case 'yesno':
      case 'scale': {
        var opts = field.options;
        if (field.type === 'scale') {
          opts = [];
          for (var n = field.min; n <= field.max; n++) opts.push(String(n));
        }
        control = el('div', {
          class: 'choices' + (field.type === 'scale' ? ' scale' : ''), role: 'radiogroup',
          'aria-labelledby': id + '_label', 'aria-describedby': described
        }, opts.map(function (o) {
          return el('label', { class: toneClass(field, o) }, [el('input', { type: 'radio', name: field.id, value: o }), labelOf(o)]);
        }));
        if (field.colors) control.classList.add('toned');
        break;
      }
      default:
        control = el('input', { id: id, name: field.id, type: 'text', maxlength: field.max || 5000, 'aria-describedby': described });
    }
    wrap.appendChild(control);
    if (extra) wrap.appendChild(extra);

    if (field.allowNa) {
      wrap.appendChild(el('label', { class: 'na' }, [
        el('input', { type: 'checkbox', class: 'na-box', onchange: function (e) { applyNa(field, e.target.checked); } }),
        'N/A'
      ]));
    }
    wrap.appendChild(el('div', { class: 'error', id: id + '_error' }));
    return wrap;
  }

  /**
   * Colour of an answer button on a colour-coded question (Fields › colors): five tones from
   * red (worst) to green (best) along the order of the options; "cd" (can't decide) stays grey.
   */
  var NEUTRAL = ['cd'];
  function toneClass(field, o) {
    if (!field.colors) return null;
    if (NEUTRAL.indexOf(o) >= 0) return 'tone-n';
    var scale = field.options.filter(function (x) { return NEUTRAL.indexOf(x) < 0; });
    if (/^[1-5](,[1-5])*$/.test(field.colors)) return 'tone-' + field.colors.split(',')[scale.indexOf(o)]; // explicit tones
    var t = scale.length > 1 ? scale.indexOf(o) / (scale.length - 1) : 0.5;
    if (field.colors === 'good_to_bad') t = 1 - t;
    return 'tone-' + (1 + Math.round(t * 4)); // tone-1 = worst … tone-5 = best
  }

  function fieldWrap(fid) {
    return document.querySelector('#data-form .field[data-field="' + CSS.escape(fid) + '"]');
  }

  function controls(wrap) {
    return Array.prototype.slice.call(wrap.querySelectorAll('input:not(.na-box), select, textarea, .codes button'));
  }

  function applyNa(field, checked) {
    var wrap = fieldWrap(field.id);
    controls(wrap).forEach(function (c) {
      c.disabled = checked;
      if (checked) { if (c.type === 'radio') c.checked = false; else if (c.tagName !== 'BUTTON') c.value = ''; }
    });
    syncCodes(field);
    clearFieldError(field.id);
    updateVisibility();
  }

  /** Highlights the code button that matches the typed value (CF, HM, …). */
  function syncCodes(field) {
    var wrap = fieldWrap(field.id), input = $('f_' + field.id);
    if (!wrap || !input) return;
    wrap.querySelectorAll('.codes button').forEach(function (b) {
      b.setAttribute('aria-pressed', input.value.trim().toUpperCase() === b.getAttribute('data-code').toUpperCase() ? 'true' : 'false');
    });
  }

  function getFieldValue(field) {
    var wrap = fieldWrap(field.id);
    var na = wrap.querySelector('.na-box');
    if (na && na.checked) return NA;
    if (GROUP_TYPES.indexOf(field.type) >= 0) {
      var checked = wrap.querySelector('input[type=radio]:checked');
      return checked ? checked.value : '';
    }
    return $('f_' + field.id).value.trim();
  }

  function setFieldValue(field, value) {
    var v = value === null || value === undefined ? '' : String(value);
    var wrap = fieldWrap(field.id);
    var na = wrap.querySelector('.na-box');
    if (v === NA && na) { na.checked = true; applyNa(field, true); return; }
    if (GROUP_TYPES.indexOf(field.type) >= 0) {
      wrap.querySelectorAll('input[type=radio]').forEach(function (r) {
        r.checked = v !== '' && r.value.toLowerCase() === v.toLowerCase();
      });
    } else {
      $('f_' + field.id).value = NUMBER_TYPES.indexOf(field.type) >= 0 ? fmtNum(v) : v;
      syncCodes(field);
    }
  }

  function collectValues() {
    var values = {};
    state.form.fields.forEach(function (field) { values[field.id] = getFieldValue(field); });
    return values;
  }

  /* Same rules as computeVisibility_() in Rules.gs. */
  function computeVisibility(fields, values) {
    var byId = {}, memo = {};
    fields.forEach(function (f) { byId[f.id] = f; });
    function test(cond, value) {
      var v = String(value || '').trim().toLowerCase();
      if (v === '' || v === NA.toLowerCase()) return false;
      var hit = cond.values.some(function (x) { return x.toLowerCase() === v; });
      return cond.op === '=' ? hit : !hit;
    }
    function visible(id, depth) {
      if (Object.prototype.hasOwnProperty.call(memo, id)) return memo[id];
      var f = byId[id];
      if (!f) return false;
      if (!f.showIf) return (memo[id] = true);
      if (depth > fields.length) return (memo[id] = false);
      return (memo[id] = visible(f.showIf.field, depth + 1) && test(f.showIf, values[f.showIf.field]));
    }
    var out = {};
    fields.forEach(function (f) { out[f.id] = visible(f.id, 0); });
    return out;
  }

  function updateVisibility() {
    if (!state.form) return {};
    var vis = computeVisibility(state.form.fields, collectValues());
    state.form.fields.forEach(function (field) { fieldWrap(field.id).hidden = !vis[field.id]; });
    document.querySelectorAll('#data-form fieldset.section').forEach(function (fs) {
      fs.hidden = !fs.querySelector('.field:not([hidden])');
    });
    return vis;
  }

  function setFieldError(fid, message) {
    var wrap = fieldWrap(fid);
    if (!wrap || wrap.hidden) return false;
    wrap.classList.add('has-error');
    wrap.querySelector('.error').textContent = message;
    return true;
  }
  function clearFieldError(fid) {
    var wrap = fieldWrap(fid);
    if (!wrap) return;
    wrap.classList.remove('has-error');
    wrap.querySelector('.error').textContent = '';
  }
  function clearAllErrors() {
    state.form.fields.forEach(function (f) { clearFieldError(f.id); });
  }
  function focusFirstError() {
    var first = document.querySelector('#data-form .field.has-error');
    if (!first) return;
    first.scrollIntoView({ block: 'center' });
    var c = first.querySelector('input:not(:disabled), select:not(:disabled), textarea:not(:disabled)');
    if (c) c.focus({ preventScroll: true });
  }

  /** Same number rules as coerceValue_() in Rules.gs; '' when the value is fine. */
  function numberError(field, v) {
    var codes = field.options || [];
    if (codes.some(function (o) { return o.toLowerCase() === v.toLowerCase(); })) return '';
    var s = v.replace(',', '.');
    var hint = codes.length ? ' nebo zvolte kód' : '';
    if (field.type === 'integer' && !/^[+-]?\d+$/.test(s)) return 'Zadejte celé číslo' + hint + '.';
    if (!/^[+-]?(\d+(\.\d*)?|\.\d+)$/.test(s)) return 'Zadejte číslo' + hint + '.';
    var n = parseFloat(s);
    if (field.min !== null && n < field.min) return 'Hodnota musí být alespoň ' + fmtNum(field.min) + '.';
    if (field.max !== null && n > field.max) return 'Hodnota může být nejvýše ' + fmtNum(field.max) + '.';
    return '';
  }

  /** Quick checks in the browser; the server repeats all of them and has the final say. */
  function validateClient() {
    var vis = updateVisibility();
    var values = {}, errors = [];
    state.form.fields.forEach(function (field) {
      if (!vis[field.id]) { values[field.id] = ''; return; }
      var v = getFieldValue(field);
      if (NUMBER_TYPES.indexOf(field.type) >= 0 && v !== NA && v !== '') v = v.replace(',', '.');
      values[field.id] = v;
      if (v === NA) return;
      var input = GROUP_TYPES.indexOf(field.type) < 0 ? $('f_' + field.id) : null;
      var add = function (m) { errors.push({ field: field.id, message: m }); };
      if (input && input.validity && input.validity.badInput) {
        add('Zadejte platnou hodnotu.');
      } else if (v === '') {
        if (field.required) add(field.allowNa ? 'Povinné – vyplňte odpověď nebo zaškrtněte N/A.' : 'Povinné pole.');
      } else if (NUMBER_TYPES.indexOf(field.type) >= 0) {
        var m = numberError(field, v);
        if (m) add(m);
      } else if (input && !input.disabled && !input.checkValidity()) {
        add(input.validationMessage);
      }
    });
    return { values: values, errors: errors };
  }

  async function save() {
    if (state.saving || !state.form) return;
    clearBanner();
    clearAllErrors();
    var f = state.form;
    var check = validateClient();
    if (check.errors.length) {
      check.errors.forEach(function (e) { setFieldError(e.field, e.message); });
      banner('error', 'Opravte prosím zvýrazněná pole (' + check.errors.length + ').');
      focusFirstError();
      return;
    }
    if (f.mode === 'edit') {
      var ok = await confirmDialog('Přepsat uložená data?',
        'Měníte uložená data: ' + formTitle(f) + '. Původní hodnoty se zapíší do auditního záznamu.', 'Uložit změny');
      if (!ok) return;
    }

    setSaving(true);
    var res = await call('apiSave', {
      form: f.form, patientId: f.patient ? f.patient.id : null, eyeId: f.eyeId || null, recordId: f.recordId || null,
      values: check.values, version: f.version, submissionId: f.mode === 'create' ? f.submissionId : null
    });
    setSaving(false);
    if (!res.ok) { showServerErrors(res); return; }

    var d = res.data, text;
    applyOverview(d.overview);
    var changed = d.changes + ' ' + plural(d.changes, 'pole změněno', 'pole změněna', 'polí změněno');
    if (d.duplicate) text = 'Tento záznam už byl uložen (opakované odeslání), nic dalšího se neuložilo.';
    else if (d.action === 'none') text = 'Beze změn – nic nebylo uloženo.';
    else if (f.form === 'REG' && d.action === 'create') text = 'Pacient ' + d.patientId + ' byl zaregistrován (' + d.eyeIds.join(', ') + ').';
    else if (f.form === 'REG' && f.addEye && d.eyeIds.indexOf(d.patientId + '-' + f.addEye) >= 0) text = 'Oko ' + d.patientId + '-' + f.addEye + ' bylo přidáno do studie.';
    else if (f.form === 'REG') text = 'Registrace ' + d.patientId + ' upravena (' + changed + ').';
    else if (f.kind === 'AE') text = 'Záznam ' + d.recordId + (d.action === 'create' ? ' uložen.' : ' upraven (' + changed + ').');
    else text = f.formLabel + ' – ' + (d.eyeId || d.patientId) + (d.action === 'create' ? ' uloženo.' : ' upraveno (' + changed + ').');
    if (f.form === 'REG' && d.action === 'create' && f.values.patient_id && f.values.patient_id !== d.patientId && !d.duplicate) {
      text += '\nKód ' + f.values.patient_id + ' mezitím přidělil někdo jiný, proto byl přidělen ' + d.patientId + '.';
    }
    if (d.inWindow === false && d.action !== 'none') text += '\nPozor: datum návštěvy je mimo cílové okno.';
    state.dirty = false;
    var msg = { kind: d.action === 'none' ? 'info' : 'success', text: text };

    // where to go next
    var eyeTarget = d.eyeId || null;
    if (f.form === 'REG') {
      if (f.addEye && d.eyeIds.indexOf(d.patientId + '-' + f.addEye) >= 0) eyeTarget = d.patientId + '-' + f.addEye;
      else if (d.action === 'create') eyeTarget = d.eyeIds[0];
      else eyeTarget = state.returnEye;
    } else if (f.kind === 'QOL') {
      eyeTarget = state.returnEye;
    }
    var newEye = f.form === 'REG' && eyeTarget && eyeTarget !== state.returnEye;
    if (eyeTarget && findEye(eyeTarget) && (state.returnTo === 'eye' || newEye)) await openEye(eyeTarget, msg, true);
    else goHome(msg, true);
  }

  function setSaving(on) {
    state.saving = on;
    $('btn-save').disabled = on;
    $('btn-cancel').disabled = on;
    $('form-back').disabled = on;
    $('btn-save').textContent = on ? 'Ukládám…' : (state.form && state.form.mode === 'edit' ? 'Uložit změny' : 'Uložit');
  }

  async function leaveForm() {
    if (state.saving || !(await confirmLeave())) return;
    state.dirty = false;
    if (state.returnTo === 'eye' && state.returnEye && findEye(state.returnEye)) openEye(state.returnEye);
    else goHome();
  }

  /* ---------- wiring ---------- */

  $('home-link').addEventListener('click', async function () {
    if (!state.init || state.saving || !(await confirmLeave())) return; // not before the PIN
    goHome();
  });
  $('btn-register').addEventListener('click', function () { openForm('REG', {}, 'home'); });
  $('btn-add-eye').addEventListener('click', function () { openPicker('addEye'); });
  $('btn-checkup').addEventListener('click', function () { openPicker('eye'); });
  $('btn-data').addEventListener('click', function () { openPicker('data'); });
  $('checkup-back').addEventListener('click', function () { goHome(); });
  $('pt-search').addEventListener('input', function (e) {
    $('pt-panel').hidden = true;
    $('pt-results').hidden = false;
    state.eyeId = null;
    renderResults(e.target.value);
  });
  $('form-back').addEventListener('click', leaveForm);
  $('btn-cancel').addEventListener('click', leaveForm);
  $('btn-save').addEventListener('click', save);

  var form = $('data-form');
  function onEdit(e) {
    state.dirty = true;
    var wrap = e.target.closest('.field');
    if (wrap) {
      var fid = wrap.getAttribute('data-field');
      clearFieldError(fid);
      var def = state.form && state.form.fields.filter(function (f) { return f.id === fid; })[0];
      if (def && NUMBER_TYPES.indexOf(def.type) >= 0) syncCodes(def);
    }
    updateVisibility();
  }
  form.addEventListener('input', onEdit);
  form.addEventListener('change', onEdit);
  form.addEventListener('submit', function (e) { e.preventDefault(); });
  $('pin-form').addEventListener('submit', submitPin);
  $('pin-input').addEventListener('input', function () {
    if ($('pin-input').value.replace(/\D/g, '').length === 6) $('pin-form').requestSubmit();
  });
  $('logout').addEventListener('click', logout);

  start();
})();
</script>
</body>
</html>
